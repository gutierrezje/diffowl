name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.14.0
            test_timeout_ms: 5000
          - os: ubuntu-latest
            node-version: 24.x
            test_timeout_ms: 5000
          - os: windows-2022
            node-version: 22.14.0
            test_timeout_ms: 15000
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter & static typecheck
        run: pnpm run lint

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.14.0'
        run: pnpm run format:check

      - name: Run unit tests
        run: pnpm run test --testTimeout=${{ matrix.test_timeout_ms }} ${{ matrix.os == 'windows-2022' && '--maxWorkers=2' || '' }}

      - name: Run offline verification controller tests
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.14.0'
        run: pnpm run test:verification

      - name: Retain failed verification evidence
        if: failure() && matrix.os == 'ubuntu-latest' && matrix.node-version == '22.14.0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verification/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify packed npm package
        run: pnpm run verify:package
